plugins {
    id 'com.android.application'
}

android {
    namespace 'com.example.desktopclock'
    compileSdk 34

    defaultConfig {
        applicationId "com.example.desktopclock"
        minSdk 23            // Android 6.0 Marshmallow
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }
}
